<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Security Verification — Quantum HealthGuard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .auth-card {
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .icon-lock {
      width: 70px;
      height: 70px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid #0284c7;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 1.5rem auto;
      font-size: 2rem;
      color: #38bdf8;
    }
    h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #f8fafc; }
    p.desc { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.5rem; }

    .question-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .q-label { font-size: 0.75rem; color: #38bdf8; font-weight: 700; text-transform: uppercase; margin-bottom: 0.3rem; }
    .q-text  { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; }

    .form-group { text-align: left; margin-bottom: 1.5rem; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #38bdf8; }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #0369a1; }
    
    .btn-back {
      display: inline-block;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #64748b;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-back:hover { color: #94a3b8; }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .alert-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
    .alert-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="icon-lock">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h2>Admin Security Verification</h2>
    <p class="desc">Only authorized administrators are granted system control access. Other devices are restricted to Client Patient View.</p>

    <div id="alert-msg" class="alert alert-error"></div>

    <form id="auth-form" onsubmit="verifyAnswer(event)">
      <div class="question-box">
        <div class="q-label"><i class="fa-solid fa-circle-question"></i> Security Question</div>
        <div class="q-text">{{ question }}</div>
      </div>

      <div class="form-group">
        <label for="answer">Enter Security Answer / Master Key:</label>
        <input type="password" id="answer" placeholder="Type answer here..." required autofocus>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-key"></i> Verify & Access Admin
      </button>
    </form>

    <a href="/" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Return to Client Patient Portal</a>
  </div>

  <script>
    async function verifyAnswer(e) {
      e.preventDefault();
      const ans = document.getElementById('answer').value.trim();
      const alertBox = document.getElementById('alert-msg');
      
      try {
        const res = await fetch('/api/admin/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answer: ans })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = '✔ Access Granted! Redirecting to Admin Control Center...';
          alertBox.style.display = 'block';
          setTimeout(() => { window.location.href = '/admin'; }, 1000);
        } else {
          alertBox.className = 'alert alert-error';
          alertBox.textContent = '❌ Access Denied: ' + (data.message || 'Incorrect security answer.');
          alertBox.style.display = 'block';
          document.getElementById('answer').value = '';
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = 'Error connecting to server.';
        alertBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
